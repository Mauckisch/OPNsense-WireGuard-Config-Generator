name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"

            echo "image_tags<<EOF" >> "${GITHUB_OUTPUT}"
            echo "ghcr.io/mauckisch/wireforge:latest" >> "${GITHUB_OUTPUT}"
            echo "ghcr.io/mauckisch/wireforge:${VERSION}" >> "${GITHUB_OUTPUT}"
            echo "ghcr.io/mauckisch/wireforge:${MAJOR}.${MINOR}" >> "${GITHUB_OUTPUT}"
            echo "ghcr.io/mauckisch/wireforge:${MAJOR}" >> "${GITHUB_OUTPUT}"
            echo "EOF" >> "${GITHUB_OUTPUT}"
          else
            echo "image_tags<<EOF" >> "${GITHUB_OUTPUT}"
            echo "ghcr.io/mauckisch/wireforge:latest" >> "${GITHUB_OUTPUT}"
            echo "EOF" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.version.outputs.image_tags }}
          labels: |
            org.opencontainers.image.title=WireForge
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import os
          import re

          version = os.environ["RELEASE_VERSION"]
          changelog = Path("CHANGELOG.md").read_text()

          pattern = re.compile(
              rf"^## \[{re.escape(version)}\]\n"
              rf"(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )

          match = pattern.search(changelog)

          if not match:
              raise SystemExit(
                  f"Changelog section for {version} not found"
              )

          notes = match.group(1).strip() + "\n"

          Path("RELEASE_NOTES.md").write_text(notes)

          print(
              f"Prepared release notes for {version}"
          )
          PYTHON

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "WireForge ${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
