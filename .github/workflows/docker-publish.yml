name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to create/update a GitHub Release for, e.g. v4.0.0. Leave empty for a normal manual Docker build."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mauckisch/opnsense-wireguard-config-generator

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest

    # A manual run with release_tag is release-only.
    # This avoids rebuilding an already published version such as v4.0.0.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - docker

    # Run automatically for version tags.
    # Also allow release-only manual runs for an existing tag.
    if: >-
      ${{
        always() &&
        (
          startsWith(github.ref, 'refs/tags/v') ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.release_tag != ''
          )
        ) &&
        (
          needs.docker.result == 'success' ||
          needs.docker.result == 'skipped'
        )
      }}

    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${TAG}"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          echo "Release tag: ${TAG}"
          echo "Version: ${VERSION}"

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Build release notes from CHANGELOG
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"

          awk -v version="${VERSION}" '
            $0 == "## [" version "]" {
              found=1
              next
            }

            found && /^## \[/ {
              exit
            }

            found {
              print
            }
          ' CHANGELOG.md > /tmp/release-notes.md

          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "No CHANGELOG entry found for version ${VERSION}."
            exit 1
          fi

          echo "===== RELEASE NOTES ====="
          cat /tmp/release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          TITLE="OPNsense WireGuard Config Generator ${VERSION}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Updating it."

            gh release edit "${TAG}" \
              --title "${TITLE}" \
              --notes-file /tmp/release-notes.md \
              --latest
          else
            echo "Creating release ${TAG}."

            gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes-file /tmp/release-notes.md \
              --latest \
              --verify-tag
          fi
