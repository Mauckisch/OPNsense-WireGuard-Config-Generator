name: Create release for existing tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, for example v4.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag: ${TAG}"
            exit 1
          fi

      - name: Check out existing tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")

          changelog = Path("CHANGELOG.md").read_text()

          pattern = re.compile(
              rf"^## \[{re.escape(version)}\]\n"
              rf"(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )

          match = pattern.search(changelog)

          if not match:
              raise SystemExit(
                  f"Changelog section for {version} not found"
              )

          notes = match.group(1).strip() + "\n"

          Path("RELEASE_NOTES.md").write_text(notes)

          print(
              f"Prepared release notes for {version}"
          )
          PYTHON

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          gh release create "${RELEASE_TAG}" \
            --title "OPNsense WireGuard Config Generator ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
