name: Create release for existing tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag, for example v4.0.0"
        required: true
        type: string

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Validate tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag: ${TAG}"
            exit 1
          fi

      - name: Check out existing tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Build release notes
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"

          awk -v version="${VERSION}" '
            $0 == "## [" version "]" {
              found=1
              next
            }

            found && /^## \[/ {
              exit
            }

            found {
              print
            }
          ' CHANGELOG.md > /tmp/release-notes.md

          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "No CHANGELOG entry found for version ${VERSION}."
            exit 1
          fi

          cat /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            exit 0
          fi

          gh release create "${TAG}" \
            --title "OPNsense WireGuard Config Generator ${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --latest \
            --verify-tag
